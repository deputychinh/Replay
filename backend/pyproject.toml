[project]
name = "relay-backend"
version = "1.0.0"
description = "Relay — customer support & SLA platform (API + worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "redis>=5.2",
  "boto3>=1.35",
  "aiosmtplib>=3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "boto3-stubs[s3,sqs]>=1.35",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N"]
ignore = ["S101", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"alembic/versions/**" = ["E501"]
"app/seed.py" = ["S311", "S105", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/seed.py"]
