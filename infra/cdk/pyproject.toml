[project]
name = "relay-infra"
version = "1.0.0"
description = "Relay on AWS: CDK app (Python)"
requires-python = ">=3.12,<3.13"
dependencies = ["aws-cdk-lib>=2.170", "constructs>=10.4"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
